          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 所属对象不可见
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "404":
          description: 所属对象不存在
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 附件列表
      tags:
      - 附件
    post:
      consumes:
      - multipart/form-data
      description: multipart/form-data 上传附件。file 必填；objectType/objectID 可选，留空表示先上传、后挂载（此时仅上传者可访问）。单文件上限与扩展名白名单来自配置
        storage.local（默认上限 64 MiB）：超出上限返回 413，扩展名不在白名单返回 400，空文件返回 400。给了 objectType/objectID
        时先校验挂载目标可见性。
      parameters:
      - description: 文件内容
        in: formData
        name: file
        required: true
        type: file
      - description: 挂载目标类型，留空表示暂不挂载
        in: formData
        name: objectType
        type: string
      - description: 挂载目标 id，留空表示暂不挂载
        in: formData
        name: objectID
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.FileResp'
              type: object
        "400":
          description: 未选择文件、文件为空、扩展名不在白名单或 objectID 非法
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 挂载目标不可见
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "404":
          description: 挂载目标不存在
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "413":
          description: 附件超出大小限制
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "503":
          description: 附件存储未启用
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 上传附件
      tags:
      - 附件
