          description: 项目或迭代不存在或不可见
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 任务看板
      tags:
      - 任务
  /users:
    get:
      description: 分页查询用户，data 为分页对象 {list,total,page,size}，list 元素为 dto.UserResp。所有筛选项都是「空值即不过滤」。
      parameters:
      - description: 按部门过滤
        in: query
        name: deptId
        type: integer
      - description: 是否包含子部门
        in: query
        name: includeSubDept
        type: boolean
      - description: 按职位过滤，如 dev/qa/pm
        in: query
        name: jobRole
        type: string
      - description: 按人员类型过滤：inside/outside/guest
        in: query
        name: type
        type: string
      - description: 是否停用；留空表示不过滤
        in: query
        name: disabled
        type: boolean
      - description: 在账号、姓名、拼音、邮箱四列上做模糊匹配
        in: query
        name: keywords
        type: string
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20，最大 200
        in: query
        name: size
        type: integer
      - description: 排序，如 id_desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 分页对象，data 为 {list,total,page,size}，list 元素为 dto.UserResp
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 user-browse 权限
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 用户列表
      tags:
      - 用户
    post:
      consumes:
      - application/json
      description: |-
        创建用户并返回详情（data 为 dto.UserResp）。account 全局唯一；口令强度不足会直接拒绝。
        Groups 传权限组 id 列表，留空表示不加入任何组。
      parameters:
      - description: 新建用户请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.CreateUserReq'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功，data 为 dto.UserResp
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "400":
          description: 参数不合法（含口令强度不足：至少 8 位、需同时含字母与数字）
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 user-create 权限
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "404":
          description: 所选部门不存在
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "409":
          description: 账号已被占用
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 新建用户
      tags:
      - 用户
  /users/{id}:
    delete:
      description: |-
        软删除用户，同时解除其全部分组关系。已被需求/任务/缺陷/工时/项目/团队引用的用户
        不允许删除（否则历史数据的经办人会指向不存在的用户），只能改为停用。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: 无内容
          schema:
            type: string
        "400":
          description: 试图删除当前登录的账号，或路径参数不合法
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 user-delete 权限
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "409":
          description: 该用户已被业务数据引用，请改为停用
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 用户
    get:
      description: 返回单个用户的完整信息（含所属权限组与上级姓名），data 为 dto.UserResp。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 用户详情，data 为 dto.UserResp
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "400":
          description: 路径参数 id 不合法
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 user-browse 权限
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 取用户详情
      tags:
      - 用户
    put:
      consumes:
      - application/json
      description: |-
        编辑用户并返回详情（data 为 dto.UserResp）。请求体字段全为指针：不传即不改，
        传空串是清空该字段（如清空手机号）。Groups 不传表示不动分组，传空数组表示全部移出。
        不能停用当前登录的账号；不能把自己设为直属上级。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 编辑用户请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.UpdateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: 编辑成功，data 为 dto.UserResp
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "400":
          description: 参数不合法（停用自身、上级为自己、入职日期格式错误等）
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 user-edit 权限
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "404":
          description: 用户或所选部门不存在
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 编辑用户
      tags:
      - 用户
  /users/{id}/password:
    post:
      consumes:
      - application/json
      description: |-
        重置目标用户的登录口令，并顺带清零失败次数、解除锁定 ——
        管理员重置的常见场景正是「用户把自己锁住了」。本接口不需要目标用户的旧口令。
      parameters:
      - description: 目标用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新口令
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.ResetPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: data 为对象，仅一个字段 reset=true
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "400":
          description: 参数不合法（口令强度不足：至少 8 位、需同时含字母与数字）
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 user-edit 权限
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "404":
          description: 目标用户不存在
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 管理员重置口令
      tags:
      - 用户
  /users/brief:
    get:
      description: |-
        供「指派给谁」这类下拉使用：只含未停用的用户，按姓名升序，data 为 dto.UserBrief 数组。
        登录即可调用、不要求 user-browse —— 选经办人不该是管理权限。
      parameters:
      - description: 在账号、姓名、拼音、邮箱四列上做模糊匹配
        in: query
        name: keywords
        type: string
      - description: 返回条数上限，默认 50；小于等于 0 或大于 200 都回落到 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 用户简要列表
          schema:
            allOf:
            - $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.UserBrief'
                  type: array
              type: object
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 用户简要列表
      tags:
      - 用户
  /workbench:
    get:
      description: |-
        一次返回首屏所需的全部数据（data 为 dto.WorkbenchResp）：counts 计数、
        tasks/bugs/reviews 三份「等我动手」的清单、notices 最近未读、efforts 我的工时概览。
        做成聚合接口是因为这几块共用同一份可见性判定，且首屏不该一块一块地长出来。
      produces:
      - application/json
      responses:
        "200":
          description: data 为 dto.WorkbenchResp
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 my-work 权限
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 工作台首屏
      tags:
      - 工作台
  /workbench/burndown:
    get:
      description: |-
        画一条剩余工时随日期递减的曲线（data 为 dto.BurndownResp）。给了 executionId 就画迭代
        （scope=execution），否则画项目（scope=project）；两者都不给会报参数错误。
        曲线取自 pm_effort 里逐日的 left 快照，不是任务的当前值；任务从它被创建那天起才计入，
        所以中途加活会表现为一次向上跳，而不是曲线整体变形。
      parameters:
      - description: 项目 ID，与 executionId 二选一
        in: query
        name: projectId
        type: integer
      - description: 迭代 ID，优先用它画曲线
        in: query
        name: executionId
        type: integer
      - description: 起始日期 YYYY-MM-DD，不传则用对象自身的起止日期
        in: query
        name: begin
        type: string
      - description: 结束日期 YYYY-MM-DD
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data 为 dto.BurndownResp，days 逐日一点、缺数据补 0
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "400":
          description: projectId 与 executionId 都没给，或日期格式不合法
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 report-browse 权限，或该私有项目/迭代不可见
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "404":
          description: 项目/迭代不存在，或所选迭代不属于该项目
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 燃尽图
      tags:
      - 工作台
securityDefinitions:
  BearerAuth:
    description: 填 `Bearer <登录返回的 accessToken>`。
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
