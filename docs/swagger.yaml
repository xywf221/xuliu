      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.BugResp'
