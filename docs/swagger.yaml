basePath: /api/v1
definitions:
  github_com_xywf221_xuliu_internal_dto.BugActivateReq:
    properties:
      assignedTo:
        description: AssignedTo 重新激活时可以直接指派给某人。
        type: integer
      comment:
        maxLength: 255
        type: string
    type: object
  github_com_xywf221_xuliu_internal_dto.BugAssignReq:
    properties:
      assignedTo:
        type: integer
      comment:
        maxLength: 255
        type: string
    required:
    - assignedTo
    type: object
  github_com_xywf221_xuliu_internal_dto.BugCloseReq:
    properties:
      comment:
        maxLength: 255
        type: string
    type: object
  github_com_xywf221_xuliu_internal_dto.BugReq:
    properties:
      assignedTo:
        type: integer
      browser:
        maxLength: 255
        type: string
      deadline:
        type: string
      executionId:
        type: integer
      files:
        description: Files 是本次提交附带的附件。
        items:
          type: integer
        type: array
      hardware:
        maxLength: 60
        type: string
      keywords:
        maxLength: 255
        type: string
      moduleId:
        type: integer
      openedBuild:
        description: OpenedBuild 是影响版本。
        maxLength: 255
        type: string
      order:
        type: integer
      os:
        maxLength: 255
        type: string
      planId:
        type: integer
      pri:
        maximum: 4
        minimum: 1
        type: integer
      productId:
        description: ProductID 必填：缺陷总是属于某个产品（Bug 是针对产品的质量问题）。
        type: integer
      projectId:
        type: integer
      relatedBugIds:
        description: RelatedBugIDs 是相关缺陷。
        items:
          type: integer
        type: array
      severity:
        description: Severity/Pri 都是 1..4（1 最高）。
        maximum: 4
        minimum: 1
        type: integer
      steps:
        type: string
      storyId:
        description: StoryID/TaskID 关联到需求或任务（在哪个需求的验证里发现的）。
        type: integer
      taskId:
        type: integer
      title:
        maxLength: 255
        type: string
      type:
        description: |-
          Type 取 codeerror/config/install/security/performance/standard/
          automation/designdefect/codeimprovement/others。
        enum:
        - codeerror
        - config
        - install
        - security
        - performance
        - standard
        - automation
        - designdefect
        - codeimprovement
        - others
        type: string
    required:
    - productId
    - title
    type: object
  github_com_xywf221_xuliu_internal_dto.BugResolveReq:
    properties:
      comment:
        maxLength: 255
        type: string
      duplicateBugId:
        description: DuplicateBugID 在解决方案为重复时必填。
        type: integer
      resolution:
        description: |-
          Resolution 必填，取 bydesign/duplicate/external/fixed/notrepro/
          postponed/willnotfix/tostory。
        type: string
      resolvedBuild:
        description: ResolvedBuild 是解决版本。
        maxLength: 255
        type: string
    required:
    - resolution
    type: object
  github_com_xywf221_xuliu_internal_dto.BugResp:
    properties:
      actions:
        items:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.TransitionResp'
        type: array
      activatedCount:
        description: ActivatedCount 是被重新激活的次数。
        type: integer
      activatedDate:
        type: string
      assignedDate:
        type: string
      assignedTo:
        type: integer
      assignedToName:
        type: string
      browser:
        type: string
      closedBy:
        type: integer
      closedByName:
        type: string
      closedDate:
        type: string
      closedReason:
        type: string
      code:
        description: Code 是稳定编号，形如 BUG-12。
        type: string
      commentCount:
        type: integer
      confirmed:
        type: integer
      deadline:
        type: string
      duplicateBugId:
        description: DuplicateBugID 在解决方式为「重复」时指向源缺陷。
        type: integer
      duplicateBugTitle:
        type: string
      executionId:
        type: integer
      executionName:
        type: string
      fileCount:
        type: integer
      files:
        description: 详情专有字段。
        items:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.FileResp'
        type: array
      hardware:
        type: string
      id:
        type: integer
      keywords:
        type: string
      moduleId:
        type: integer
      moduleName:
        type: string
      openedBuild:
        type: string
      openedBy:
        type: integer
      openedByName:
        type: string
      openedDate:
        type: string
      order:
        type: integer
      os:
        type: string
      planId:
        type: integer
      planTitle:
        type: string
      pri:
        type: integer
      priLabel:
        type: string
      productId:
        type: integer
      productName:
        type: string
      projectId:
        type: integer
      projectName:
        type: string
      relatedBugIds:
        items:
          type: integer
        type: array
      resolution:
        type: string
      resolutionLabel:
        type: string
      resolvedBuild:
        type: string
      resolvedBy:
        type: integer
      resolvedByName:
        type: string
      resolvedDate:
        type: string
      severity:
        type: integer
      severityLabel:
        type: string
      status:
        type: string
      statusLabel:
        type: string
      steps:
        type: string
      storyId:
        type: integer
      storyTitle:
        type: string
      storyVersion:
        type: integer
      taskId:
        type: integer
      taskName:
        type: string
      title:
        type: string
      toStoryId:
        description: ToStoryID 是「已转需求」后的成果。
        type: integer
      toStoryTitle:
        type: string
      type:
        type: string
      typeLabel:
        type: string
    type: object
  github_com_xywf221_xuliu_internal_dto.BugStatusCountsResp:
    properties:
      active:
        type: integer
      closed:
        type: integer
      resolved:
        type: integer
      unresolved:
        description: Unresolved 是尚未给出解决方案的（resolution 为空）数量。
        type: integer
    type: object
  github_com_xywf221_xuliu_internal_dto.BugToStoryReq:
    properties:
      assignedTo:
        description: AssignedTo 是新需求的负责人。
        type: integer
      comment:
        maxLength: 255
        type: string
      files:
        description: |-
          Files 是随需求一起带过去的附件（常是缺陷的截图）。

          注意是**转移**而非复制：附件只有一份归属，转过去之后缺陷详情页
          就不再显示它们了。不想让缺陷丢掉截图就别传这个字段。
        items:
          type: integer
        type: array
      productId:
        description: ProductID 是转入的产品，留空表示留在原产品。
        type: integer
      reviewers:
        description: |-
          Reviewers 是新需求的评审人；产品开了评审又没设默认评审人时，
          必须在这里给出，否则这条需求会建不出来（评审人缺失是硬错误）。
        items:
          type: integer
        type: array
      spec:
        type: string
      title:
        description: Title/Spec 留空时用缺陷的标题与重现步骤兜底。
        maxLength: 255
        type: string
      verify:
        type: string
    type: object
  github_com_xywf221_xuliu_internal_dto.ChangePasswordReq:
    properties:
      newPassword:
        maxLength: 128
        minLength: 8
        type: string
      oldPassword:
        maxLength: 128
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  github_com_xywf221_xuliu_internal_dto.CommentReq:
    properties:
      content:
        maxLength: 5000
        type: string
      files:
        description: Files 是评论附带的附件 id。
        items:
          type: integer
        type: array
      objectID:
        type: integer
      objectType:
        enum:
        - story
        - task
        - bug
        - project
        - execution
        - product
        - productplan
        - module
        type: string
    required:
    - content
    - objectID
    - objectType
    type: object
  github_com_xywf221_xuliu_internal_dto.CommentResp:
    properties:
      avatar:
        description: Avatar 便于前端直接渲染头像，不必再查一次用户。
        type: string
      content:
        type: string
      createdAt:
        type: string
      files:
        items:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.FileResp'
        type: array
      id:
        type: integer
      objectID:
        type: integer
      objectType:
        type: string
      userId:
        type: integer
      userName:
        type: string
    type: object
  github_com_xywf221_xuliu_internal_dto.CreateDeptReq:
    properties:
      manager:
        type: integer
      name:
        maxLength: 60
        type: string
      order:
        type: integer
      parentId:
        type: integer
    required:
    - name
    type: object
  github_com_xywf221_xuliu_internal_dto.CreateGroupReq:
    properties:
      desc:
        maxLength: 255
        type: string
      jobRole:
        maxLength: 10
        type: string
      name:
        maxLength: 60
        type: string
      privs:
        items:
          type: string
        type: array
    required:
    - name
    type: object
  github_com_xywf221_xuliu_internal_dto.CreateStoryReq:
    properties:
      assignedTo:
        description: AssignedTo 是初始指派。
        type: integer
      category:
        enum:
        - feature
        - interface
        - performance
        - safe
        - experience
        - improve
        - other
        type: string
      comment:
        type: string
      estimate:
        description: Estimate 是预计工时，nil 表示未估。
        minimum: 0
        type: number
      files:
        description: Files 是随需求一起提交的附件 id（需先调用上传接口）。
        items:
          type: integer
        type: array
      keywords:
        maxLength: 255
        type: string
      moduleId:
        type: integer
      parentId:
        description: ParentID 用于拆分子需求。
        type: integer
      planId:
        type: integer
      pri:
        maximum: 4
        type: integer
      productId:
        type: integer
      reviewers:
        description: Reviewers 是评审人；留空则用产品的默认评审人。
        items:
          type: integer
        type: array
      source:
        enum:
        - customer
        - user
        - po
        - market
        - service
        - operation
        - support
        - competitor
        - partner
        - dev
        - tester
        - bug
        - forum
        - other
        type: string
      sourceNote:
        maxLength: 255
        type: string
      spec:
        type: string
      title:
        maxLength: 255
        type: string
      type:
        enum:
        - story
        - requirement
        - epic
        type: string
      verify:
        type: string
    required:
    - productId
    - title
    type: object
  github_com_xywf221_xuliu_internal_dto.CreateUserReq:
    properties:
      account:
        maxLength: 30
        minLength: 2
        type: string
      deptId:
        description: Account 之外的字段都可选，由管理员按需填写。
        type: integer
      email:
        maxLength: 120
        type: string
      gender:
        enum:
        - m
        - f
        type: string
      groups:
        description: Groups 是所属权限组 id 列表。
        items:
          type: integer
        type: array
      jobRole:
        enum:
        - dev
        - qa
        - pm
        - po
        - td
        - pd
        - qd
        - top
        - others
        type: string
      join:
        description: Join 是入职日期，格式 YYYY-MM-DD。
        type: string
      mobile:
        maxLength: 30
        type: string
      nickname:
        maxLength: 60
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
      phone:
        maxLength: 30
        type: string
      qq:
        maxLength: 30
        type: string
      realname:
        maxLength: 60
        type: string
      superiorId:
        type: integer
      type:
        enum:
        - inside
        - outside
        - guest
        type: string
      weixin:
        maxLength: 60
        type: string
    required:
    - account
    - password
    - realname
    type: object
  github_com_xywf221_xuliu_internal_dto.DeptResp:
    properties:
      children:
        description: Children 仅在返回树形结构时填充。
        items:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.DeptResp'
        type: array
      grade:
        type: integer
      hasChildren:
        description: HasChildren 让前端知道是否显示展开箭头。
        type: boolean
      id:
        type: integer
      managerId:
        type: integer
      managerName:
        type: string
      name:
        type: string
      order:
        type: integer
      parentId:
        type: integer
      path:
        type: string
      userCount:
        description: UserCount 是直属本部门的用户数（不含子部门）。
        type: integer
    type: object
  github_com_xywf221_xuliu_internal_dto.EffortReq:
    properties:
      begin:
        description: Begin/End 是当日工作时段，形如 0900 / 1800。
        type: string
      comment:
        maxLength: 255
        type: string
      consumed:
        type: number
      date:
        description: Date 是报工日期，格式 YYYY-MM-DD。
        type: string
      end:
        type: string
      left:
        minimum: 0
        type: number
      userId:
        description: UserID 是给哪个成员报工；多人任务里留空表示「算在当前登录用户头上」。
        type: integer
      work:
        maxLength: 1000
        type: string
    required:
    - consumed
    type: object
  github_com_xywf221_xuliu_internal_dto.EffortResp:
    properties:
      begin:
        type: string
      consumed:
        type: number
      createdAt:
        type: string
      date:
        type: string
      end:
        type: string
      executionId:
        type: integer
      id:
        type: integer
      left:
        type: number
      objectId:
        type: integer
      objectType:
        type: string
      projectId:
        type: integer
      realname:
        type: string
      userId:
        type: integer
      work:
        type: string
    type: object
  github_com_xywf221_xuliu_internal_dto.ExecutionReq:
    properties:
      acl:
        enum:
        - open
        - private
        type: string
      begin:
        description: Begin/End 是计划起止日期，格式 YYYY-MM-DD。
        type: string
      code:
        maxLength: 45
        type: string
      desc:
        type: string
      end:
        type: string
      name:
        maxLength: 90
        type: string
      order:
        type: integer
      pm:
        type: integer
      po:
        type: integer
      projectId:
        type: integer
      qd:
        type: integer
      rd:
        type: integer
      status:
        enum:
        - wait
        - doing
        - suspended
        - closed
        type: string
      team:
        description: |-
          Team 是该迭代独立的团队（可选）。留空则只有项目团队可用，
          也就是说迭代团队是「项目团队的子集」这一约束由服务层保证。
        items:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.TeamMemberReq'
        type: array
      type:
        description: Type 取 sprint / stage / kanban。
        enum:
        - sprint
        - stage
        - kanban
        type: string
      whitelist:
        items:
          type: integer
        type: array
    required:
    - name
    - projectId
    type: object
  github_com_xywf221_xuliu_internal_dto.ExecutionResp:
    properties:
      acl:
        type: string
      actions:
        items:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.TransitionResp'
        type: array
      begin:
        type: string
      closedBy:
        type: integer
      closedDate:
        type: string
      closedReason:
        type: string
      code:
        type: string
      consumed:
        type: number
      days:
        type: integer
      desc:
        type: string
      end:
        type: string
      estimate:
        type: number
      id:
        type: integer
      left:
        type: number
      memberCount:
        description: |-
          MemberCount 是该迭代实际可用的人数：迭代团队为空时按项目团队算，
          与「任务能派给谁」的口径一致。
        type: integer
      name:
        type: string
      number:
        description: Number 是面向用户的编号，形如 EXEC-5。
        type: string
      openedBy:
        type: integer
      openedDate:
        type: string
      order:
        type: integer
      pm:
        type: integer
      po:
        type: integer
      progress:
        type: integer
      projectId:
        type: integer
      projectName:
        type: string
      qd:
        type: integer
      rd:
        type: integer
      realBegan:
        type: string
      realEnd:
        type: string
      status:
        type: string
      statusLabel:
        type: string
      storyCount:
        description: StoryCount/TaskCount 是统计字段，仅详情填充。
        type: integer
      suspendedDate:
        type: string
      taskCount:
        type: integer
      taskHours:
        allOf:
        - $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.HoursResp'
        description: Hours 是该迭代下任务的工时汇总（进度与燃尽图都用它）。
      team:
        description: |-
          Team 是迭代**自己**的团队，仅详情填充。

          为空表示这个迭代沿用项目团队（而不是「没人可用」）。
          这里刻意不回落到项目团队的行：前端拿着这些行去增删改，
          一动就会改到项目团队上。
        items:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.TeamMemberResp'
        type: array
      type:
        type: string
      typeLabel:
        type: string
      whitelist:
        items:
          type: integer
        type: array
    type: object
  github_com_xywf221_xuliu_internal_dto.FileResp:
    properties:
      contentType:
        type: string
      createdAt:
        type: string
      downloads:
        type: integer
      ext:
        description: Ext 是扩展名（含点），供前端挑图标。
        type: string
      id:
        type: integer
      name:
        type: string
      size:
        type: integer
      sizeText:
        description: SizeText 是人读的大小（如 "1.2 MB"），前端不必自己写换算。
        type: string
      url:
        description: |-
          URL 仅在后端支持直链（如配了 CDN 的 S3）时非空。
          为空时前端走 /files/:id/download。
        type: string
      userId:
        type: integer
      userName:
        type: string
    type: object
  github_com_xywf221_xuliu_internal_dto.GroupResp:
    properties:
      desc:
        type: string
      id:
        type: integer
      jobRole:
        type: string
      name:
        type: string
      privCount:
        description: PrivCount 是权限点数量，列表接口用它替代 Privs 以免响应过大。
        type: integer
      privs:
        description: Privs 是权限点列表，仅详情接口填充。
        items:
          type: string
        type: array
      projectId:
        description: ProjectID 为 0 表示全局组。
        type: integer
      userCount:
        description: UserCount 是组内成员数。
        type: integer
      users:
        description: Users 是组内成员，仅详情接口填充。
        items:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.UserBrief'
        type: array
    type: object
  github_com_xywf221_xuliu_internal_dto.HoursResp:
    properties:
      consumed:
        type: number
      estimate:
        type: number
      left:
        type: number
    type: object
  github_com_xywf221_xuliu_internal_dto.KanbanColumn:
    properties:
      count:
        type: integer
      hours:
        $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.HoursResp'
      label:
        type: string
      status:
        type: string
      tasks:
        items:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.TaskResp'
        type: array
    type: object
  github_com_xywf221_xuliu_internal_dto.KanbanResp:
    properties:
      columns:
        items:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.KanbanColumn'
        type: array
      executionId:
        type: integer
      projectId:
        type: integer
      scope:
        description: Scope 说明看板的范围（project / execution）。
        type: string
    type: object
  github_com_xywf221_xuliu_internal_dto.LoginReq:
    properties:
      account:
        maxLength: 30
        type: string
      password:
        maxLength: 128
        type: string
      remember:
        description: Remember 为 true 时前端应保存刷新令牌以便长期免登录。
        type: boolean
    required:
    - account
    - password
    type: object
  github_com_xywf221_xuliu_internal_dto.LoginResp:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      profile:
        allOf:
        - $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.ProfileResp'
        description: Profile 顺带返回用户信息与权限，省掉前端登录后再发一次请求。
      refreshToken:
        type: string
      tokenType:
        type: string
    type: object
  github_com_xywf221_xuliu_internal_dto.ModuleReq:
    properties:
      desc:
        type: string
      name:
        maxLength: 60
        type: string
      order:
        type: integer
      owner:
        type: integer
      parentId:
        type: integer
      root:
        description: Root 是所属产品 id。
        type: integer
      short:
        maxLength: 60
        type: string
      type:
        description: Type 取 story / task / bug。
        enum:
        - story
        - task
        - bug
        type: string
    required:
    - name
    - root
    - type
    type: object
  github_com_xywf221_xuliu_internal_dto.ModuleResp:
    properties:
      children:
        description: Children 在树接口里填充，扁平接口里为空。
        items:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.ModuleResp'
        type: array
      desc:
        type: string
      grade:
        type: integer
      id:
        type: integer
      name:
        type: string
      order:
