        in: query
        name: executionId
        type: integer
      - description: 按产品过滤
        in: query
        name: productId
        type: integer
      - description: 按关联需求过滤
        in: query
        name: storyId
        type: integer
      - description: 按模块过滤，传 0 与不传都表示不过滤
        in: query
        name: moduleId
        type: integer
      - description: 状态：wait/doing/pause/done/cancel/closed
        in: query
        name: status
        type: string
      - description: 任务类型：design/devel/request/test/study/discuss/ui/affair/misc
        in: query
        name: type
        type: string
      - description: 优先级 1..4
        in: query
        name: pri
        type: integer
      - description: 按指派人过滤
        in: query
        name: assignedTo
        type: integer
      - description: 按创建人过滤
        in: query
        name: openedBy
        type: integer
      - description: 按完成人过滤
        in: query
        name: finishedBy
        type: integer
      - description: 只看顶层任务，不显示子任务
        in: query
        name: topOnly
        type: boolean
      - description: 只看未完成（未开始/进行中/暂停）的任务
        in: query
        name: unfinished
        type: boolean
      - description: 标题 / 关键词模糊匹配
        in: query
        name: keywords
        type: string
      - description: 截止日期下限 YYYY-MM-DD
        in: query
        name: deadlineFrom
        type: string
      - description: 截止日期上限 YYYY-MM-DD
        in: query
        name: deadlineTo
        type: string
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20，最大 200
        in: query
        name: size
