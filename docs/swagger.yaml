  /projects/{id}/stories:
    get:
      description: 返回项目下已排入的需求列表。不传 executionId 时返回项目全部（含未分配到迭代的）；传了则只看该迭代内的，且校验迭代属于该项目。每条记录带排入时的版本号（version）与是否已过期（outdated），需求后续变更时
        outdated 置 true。
      parameters:
      - description: 项目 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 只看该迭代内已排入的需求
        in: query
        name: executionId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.StoryLinkResp'
                  type: array
              type: object
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 project-browse 权限
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "404":
          description: 项目或迭代不存在
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 项目已排入的需求
      tags:
      - 项目
    post:
      consumes:
      - application/json
      description: 把需求排入项目，可同时用 executionId 指定迭代。服务端校验：需求所属产品必须已关联到该项目（否则 400，跨产品需求排不进来）；只有已评审通过的需求可排入（否则
        409）；项目已关闭不可排入（409）；executionId 非 0 时迭代必须属于该项目。排期记录会存下排入时的 story 版本号，需求后来变更时前端据此提示「排入版本已过时」。排期记录以
        (project_id, story_id) 为唯一，重复排入不新增记录而是更新已有关联（executionId / version / order）。
      parameters:
      - description: 项目 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 排期信息：storyId 必填，executionId 可选
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.StoryLinkReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.StoryLinkResp'
              type: object
        "400":
          description: 参数不合法，或需求所属产品未关联到此项目
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 project-edit 权限
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "404":
          description: 项目 / 需求 / 迭代不存在
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "409":
          description: 项目已关闭，或需求当前状态不可排入
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 需求排入项目/迭代
      tags:
      - 项目
  /projects/{id}/stories/{storyId}:
