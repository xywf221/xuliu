      requestId:
        type: string
    type: object
info:
  contact: {}
  description: |-
    让项目有序，让协作流动。需求、任务、迭代与缺陷一体化的研发管理平台。

    响应外壳：成功为 `{"data": …, "requestId": …}`，失败为 `{"code": …, "message": …, "requestId": …}`。
    判成功只看 HTTP 状态码是否为 2xx，不必再在成功体里判 code。
  title: 序流 API
  version: "1.0"
paths:
  /actions:
    get:
      description: 分页查询只读的操作留痕，供详情页的时间线展示。必须给出至少一个查询范围：objectType+objectID（某对象的完整时间线）、productId、projectId、executionId
        或 actorId，否则返回 400。按对象查时先校验该对象的可见性；其余查询按当前用户可见的产品/项目过滤。
      parameters:
      - description: 对象类型，与 objectID 成对使用
        in: query
        name: objectType
        type: string
      - description: 对象 ID，与 objectType 成对使用
        in: query
        name: objectID
        type: integer
      - description: 按产品过滤
        in: query
        name: productId
        type: integer
      - description: 按项目过滤
        in: query
        name: projectId
        type: integer
      - description: 按迭代过滤
        in: query
        name: executionId
        type: integer
      - description: 按操作人过滤
        in: query
        name: actorId
        type: integer
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20，最大 200
        in: query
        name: size
        type: integer
      - description: 排序，如 id_desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 分页对象，data 为 {list,total,page,size}，list 元素为 dto.ActionResp
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "400":
          description: 未指定任何查询范围
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 所属对象不可见
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "404":
          description: 所属对象不存在
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 操作历史列表
      tags:
      - 操作历史
  /auth/login:
    post:
      consumes:
      - application/json
      description: 账号口令登录，成功后返回访问令牌、刷新令牌与当前用户信息权限。
      parameters:
      - description: 登录请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.LoginResp'
              type: object
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 账号或密码错误
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      summary: 登录
      tags:
      - 认证
  /auth/logout:
    post:
      description: 无状态 JWT 无法在服务端作废令牌，这里只做客户端语义，由前端清除本地令牌。
      produces:
      - application/json
      responses:
        "204":
          description: 无内容
          schema:
            type: string
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 登出
      tags:
      - 认证
  /auth/password:
    post:
      consumes:
      - application/json
      description: 只改当前登录人的口令，不收 userId 参数。旧口令校验失败返回 401 —— 那是「凭据不对」，不是「没登录」，但都归在这一类。
      parameters:
      - description: 旧口令与新口令
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.ChangePasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"changed\": true}'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: 参数不合法（新口令少于 8 位等）
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录，或旧口令不正确
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 修改本人口令
      tags:
      - 认证
  /auth/profile:
    get:
      description: 返回当前登录用户的基本信息与权限点列表，供前端渲染菜单与按钮。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.ProfileResp'
              type: object
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 当前用户信息
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 用刷新令牌换取新的访问令牌。公开接口，访问令牌已过期时仍可调用。
      parameters:
      - description: 刷新令牌请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.RefreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.LoginResp'
              type: object
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 刷新令牌无效或已过期
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      summary: 刷新访问令牌
      tags:
      - 认证
  /bugs:
    get:
      description: 分页查询缺陷。所有筛选项都是「空值即不过滤」。
      parameters:
      - description: 按产品过滤
        in: query
        name: productId
        type: integer
      - description: 按项目过滤
        in: query
        name: projectId
        type: integer
      - description: 按迭代过滤
        in: query
        name: executionId
        type: integer
      - description: 按模块过滤
        in: query
        name: moduleId
        type: integer
      - description: 按产品计划过滤
        in: query
        name: planId
        type: integer
      - description: 按关联需求过滤
        in: query
        name: storyId
        type: integer
      - description: 按关联任务过滤
        in: query
        name: taskId
        type: integer
      - description: 状态：active/resolved/closed
        in: query
        name: status
        type: string
      - description: 解决方案
        in: query
        name: resolution
        type: string
      - description: 只看还没给出解决方案的缺陷
        in: query
        name: unresolved
        type: boolean
      - description: 缺陷类型
        in: query
        name: type
        type: string
      - description: 严重程度 1..4
        in: query
        name: severity
        type: integer
      - description: 优先级 1..4
        in: query
        name: pri
        type: integer
      - description: 是否已确认：0 未确认，1 已确认
        in: query
        name: confirmed
        type: integer
      - description: 按指派人过滤
        in: query
        name: assignedTo
        type: integer
      - description: 按创建人过滤
        in: query
        name: openedBy
        type: integer
      - description: 按解决人过滤
        in: query
        name: resolvedBy
        type: integer
      - description: 标题 / 关键词模糊匹配
        in: query
        name: keywords
        type: string
      - description: 截止日期下限 YYYY-MM-DD
        in: query
        name: deadlineFrom
        type: string
      - description: 截止日期上限 YYYY-MM-DD
        in: query
        name: deadlineTo
        type: string
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20，最大 200
        in: query
        name: size
        type: integer
      - description: 排序，如 id_desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.BugResp'
                  type: array
              type: object
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 bug-browse 权限
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 缺陷列表
      tags:
      - 缺陷
    post:
      description: 新建缺陷，缺陷必属某产品。可以不指派处理人（assignedTo=0 表示待认领）；附件通过 files 关联已上传的文件 id。
      parameters:
      - description: 缺陷信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.BugReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_xywf221_xuliu_internal_dto.BugResp'
              type: object
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 bug-create 权限
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 创建缺陷
      tags:
      - 缺陷
  /bugs/{id}:
    delete:
      description: 按 ID 删除缺陷，成功返回 204 无响应体。
      parameters:
      - description: 缺陷 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 bug-delete 权限
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "404":
          description: 缺陷不存在
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 删除缺陷
