        "401":
          description: 未登录或令牌已失效
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "403":
          description: 无 bug-browse 权限
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
        "404":
          description: 缺陷不存在
          schema:
            $ref: '#/definitions/github_com_xywf221_xuliu_internal_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: 缺陷详情
      tags:
